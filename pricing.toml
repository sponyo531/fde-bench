# 来源：webagent-experiment-log/模型价格表.md —— 唯一权威，改价请先改那份。
# 与 config.toml 分开：单价是公共数据，进版本库共享；config.toml 含端点不入库。
#
#   cache_write 缺省  = 该模型无独立缓存创建价，按 input 价兜底
#   tier_threshold    = 按每 step 的 input+cache_read 是否超阈值分档计价
#   变体名（如 gpt-5.6-sol/high）自动归一到底层模型，同价
