# deepseek 系列一律走华颜网关的 `ds/` 路由（国产卡部署），且**统一按峰值价**计
# （模型价格表.md：峰值 = 周一至周五 UTC 01:00–04:00、06:00–10:00；谷值为峰值一半；
# 用户 2026-09-02 指定全部按峰值算，不按请求时间切换）。无独立缓存创建价，
# cache_write 按 input 兜底。
["ds/deepseek-v4-pro"]
